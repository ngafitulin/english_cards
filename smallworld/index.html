<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110d">
<title>Маленький мир — стратегия онлайн</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
<style>
:root{--bg:#14110d;--panel:#231d16;--card:#17130e;--txt:#f1e8d6;--muted:#b6a88d;--acc:#e8b84a;--pri:#2f8f5b;--line:#ffffff17;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at top,#3a2e20,#14110d 70%) fixed;color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}
button{font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:0;background:#4a3a28;color:#fff;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){filter:brightness(1.15)}
button:disabled{opacity:.38;cursor:default}
button.pri{background:var(--pri);font-weight:600}
button.warn{background:#8a3b2a}
button.gold{background:#a7791f;font-weight:600}
input,select{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid #5a4630;background:#120e0a;color:#fff;width:100%}
.screen{max-width:520px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:32px;margin:6px 0 2px;letter-spacing:.3px}
h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px;line-height:1.4}
.card{background:var(--panel);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px #0006;border:1px solid var(--line)}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
.fld{display:block;margin-bottom:12px;color:var(--muted);font-size:14px}.fld input{margin-top:4px}
.np{display:flex;gap:6px}.np label{flex:1}
.np input{display:none}
.np span{display:block;text-align:center;padding:10px 0;border-radius:10px;background:var(--card);border:2px solid transparent;cursor:pointer;font-weight:700}
.np input:checked+span{border-color:var(--acc);color:var(--acc)}
.code{font-size:44px;font-weight:800;letter-spacing:8px;text-align:center;color:var(--acc);margin:4px 0 10px;font-family:ui-monospace,Menlo,monospace}
.link{font-size:12px;color:var(--muted);word-break:break-all;text-align:center;margin:6px 0}
.seat{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--card);border-radius:10px;margin-bottom:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555;margin-right:6px}
.dot.ok{background:#34d399}.dot.wait{background:#f59e0b}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;margin-right:6px;vertical-align:-1px}
#roommsg{color:var(--muted);font-size:14px;margin:8px 0}
/* игра */
#game{height:100%}
.gwrap{display:flex;flex-direction:column;height:100vh;height:100dvh}
.mapbox{position:relative;flex:0 0 auto;height:min(58vh,105vw);height:min(58dvh,105vw);overflow:hidden;background:#0b0907;touch-action:none;user-select:none;-webkit-user-select:none}
#world{position:absolute;left:0;top:0;width:1500px;height:1000px;transform-origin:0 0;will-change:transform}
#world canvas,#world svg{position:absolute;left:0;top:0;width:1500px;height:1000px}
#cvHl{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
#svg{pointer-events:none;overflow:visible}
#svg text{font-family:var(--emoji)}
.mapbtns{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
.mapbtns button{width:34px;height:34px;padding:0;border-radius:50%;background:#0008;opacity:.85;font-size:18px;font-size:20px;backdrop-filter:blur(4px)}
#topbar{position:absolute;left:8px;top:8px;right:56px;display:flex;gap:6px;flex-wrap:wrap;z-index:3;pointer-events:none}
.chip{background:#000b;backdrop-filter:blur(4px);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#0b0907;z-index:4;color:var(--muted)}
.bar{width:220px;height:6px;border-radius:9px;background:#333;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc)}
.side{flex:1 1 auto;overflow:auto;padding:10px 10px 30px;background:var(--panel);border-top:1px solid #000}
@media (min-width:900px){
  .gwrap{flex-direction:row}
  .mapbox{flex:1 1 auto;height:100vh;height:100dvh}
  .side{flex:0 0 380px;border-top:0;border-left:1px solid #000;height:100vh;height:100dvh}
}
#msg{background:var(--card);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 8px;line-height:1.4;border:2px solid transparent;border-left-width:7px}
#msg .who{display:block;font-size:19px;font-weight:800;margin-bottom:3px}
#msg.me{background:#173322;border-color:#34d399;animation:myturn 1.6s ease-in-out infinite}
#msg.me .who{color:#6ee7b7}
@keyframes myturn{50%{border-color:#a7f3d0;box-shadow:0 0 18px #34d39988}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.acts .wide{grid-column:span 2}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:8px}
.seg button{flex:1;background:transparent;padding:8px}
.seg button.on{background:#5a4630}
.sheet{background:#2f271d;border:1px solid #6b5639;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sheet b{font-size:16px}
.sheet .info{font-size:13px;color:var(--muted);margin:4px 0 8px;line-height:1.45}
.xbtn{width:30px;height:30px;padding:0;border-radius:50%;background:#0006;font-size:14px;flex-shrink:0}
.stepper{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.stepper button{width:46px;font-size:20px;padding:6px 0}
.stepper .num{min-width:44px;text-align:center;font-size:20px;font-weight:800}
.pl{background:var(--card);border-radius:10px;padding:7px 9px;margin-bottom:6px;border:2px solid transparent}
.pl.on{border-color:var(--acc)}
.pl .nm{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.pl .rc{font-size:12.5px;color:var(--muted);margin-top:3px}
.pl .rc.dec{opacity:.75}
#log{font-size:12.5px;line-height:1.45;opacity:.85;max-height:160px;overflow:auto;margin:8px 0}
#log div{border-bottom:1px solid var(--line);padding:2px 0}
details{font-size:13px;line-height:1.5;background:var(--card);border-radius:10px;padding:8px 10px;margin-top:6px}
summary{cursor:pointer;font-weight:600}
.over{background:#3d2f05;border:2px solid var(--acc);border-radius:10px;padding:10px;margin-bottom:8px;font-size:15px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111e;color:#fff;padding:10px 16px;border-radius:10px;
  font-size:14px;z-index:99;pointer-events:none;opacity:0;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#scorePop{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top));transform:translateX(-50%);z-index:95;background:#2b2112f2;border:2px solid var(--acc);border-radius:14px;
  padding:10px 16px;min-width:220px;box-shadow:0 10px 30px #000a;pointer-events:none;transition:opacity .3s;opacity:0}
#scorePop.show{opacity:1}
#scorePop b{font-size:18px;display:block;margin-bottom:4px}
#scorePop div{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:14px}
.modalWrap{position:fixed;inset:0;background:#000b;z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
@media (min-width:640px){.modalWrap{align-items:center}}
.modalCard{background:var(--panel);width:100%;max-width:600px;max-height:85vh;max-height:85dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px #0008}
@media (min-width:640px){.modalCard{border-radius:16px;max-height:84vh;max-height:84dvh}}
.modalHead .xbtn{width:40px;height:40px;font-size:18px;background:#4a3a28}
.modalFoot{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.modalFoot button{width:100%}
.modalHead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:18px}
.modalBody{overflow:auto;padding:10px 14px 18px}
.combo{display:flex;gap:12px;align-items:stretch;background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px;border:1px solid var(--line)}
.combo .token{flex:0 0 64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-family:var(--emoji);
  background:radial-gradient(circle at 35% 30%,#fff8e6,#d6c39a 55%,#8d7650);box-shadow:inset 0 -4px 6px #0006,0 3px 6px #000a;border:3px solid #6f5634}
.combo .t{flex:1;min-width:0}
.combo .t b{font-size:16px}
.combo .t small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:3px}
.combo .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12.5px}
.combo .meta span{background:#ffffff12;border-radius:99px;padding:2px 8px}
.combo button{align-self:center;flex:0 0 auto}
.legItem{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.legItem:last-child{border-bottom:0}
.legIco{font-size:28px;line-height:1;width:46px;text-align:center;flex-shrink:0;font-family:var(--emoji)}
.legIco canvas{width:88px;height:56px;border-radius:8px;box-shadow:0 2px 6px #000a;display:block}
.legItem.sw2 .legIco{width:88px}
.legTxt b{display:block;font-size:15px;margin-bottom:1px}
.legTxt span{font-size:13.5px;color:var(--muted);line-height:1.4}
.legH{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--acc);margin:16px 0 2px}
</style>
</head>
<body>

<section id="lobby" class="screen">
  <h1>🗺️ Маленький мир</h1>
  <p class="sub">Стратегия о расах, которым тесно на одной карте: захватывайте земли, уходите в упадок и выводите новый народ. Можно на одном телефоне или каждый со своего.</p>
  <label class="fld">Ваше имя<input id="myname" maxlength="16" placeholder="Вождь"></label>
  <div id="resume"></div>
  <div class="card">
    <h2>Новая игра</h2>
    <div class="fld" style="margin-bottom:6px">Сколько игроков</div>
    <div class="np" id="npSel"></div>
    <div class="row"><button id="bLocal">На одном телефоне</button><button id="bHost" class="pri">Онлайн-комната</button></div>
  </div>
  <div class="card">
    <h2>Присоединиться по коду</h2>
    <div class="row"><input id="joincode" placeholder="КОД" maxlength="5" autocapitalize="characters" autocomplete="off"><button id="bJoin" class="pri">Войти</button></div>
  </div>
  <div class="card">
    <button id="bLegendLobby" style="width:100%;margin-bottom:10px">❔ Легенда: местность, значки, расы</button>
    <details id="rulesL"></details>
  </div>
</section>

<section id="room" class="screen" hidden>
  <div class="card">
    <h2>Комната</h2>
    <div class="code" id="roomcode"></div>
    <div id="hostShare">
      <button id="bShare" class="pri" style="width:100%">Отправить приглашение</button>
      <div class="link" id="roomlink"></div>
    </div>
    <div id="roommode" class="sub" style="margin:8px 0"></div>
    <div id="seats"></div>
    <div id="roommsg"></div>
    <div class="row"><button id="bLeave">Выйти</button><button id="bStart" class="pri">Начать игру</button></div>
  </div>
</section>

<section id="game" hidden>
  <div class="gwrap">
    <div class="mapbox" id="mapbox">
      <div id="world"><canvas id="cvMap"></canvas><canvas id="cvOwn"></canvas><canvas id="cvHl"></canvas><svg id="svg" viewBox="0 0 1500 1000" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div id="topbar"></div>
      <div class="mapbtns"><button id="zIn" aria-label="Приблизить">+</button><button id="zOut" aria-label="Отдалить">−</button><button id="zFit" aria-label="Вся карта">⤢</button></div>
      <div id="loading"><div>Рисую карту…</div><div class="bar"><i id="lbar"></i></div></div>
    </div>
    <div class="side" id="side">
      <div id="over"></div>
      <div id="msg"></div>
      <div id="sheet"></div>
      <div id="ctl"></div>
      <div id="players"></div>
      <div class="acts">
        <button id="bMarket">🧝 Расы на выбор</button>
        <button id="bLegend">❔ Легенда</button>
      </div>
      <div id="log"></div>
      <div class="acts">
        <button id="bMenu">Меню</button>
        <button id="bAgain" class="pri" hidden>Новая партия</button>
      </div>
      <details id="rulesG"></details>
    </div>
  </div>
</section>

<div id="toast"></div>
<div id="scorePop"></div>
<div id="marketModal" class="modalWrap" hidden>
  <div class="modalCard" role="dialog" aria-label="Расы на выбор">
    <div class="modalHead"><b>Расы на выбор</b><button class="xbtn" data-close="marketModal" aria-label="Закрыть">✕</button></div>
    <div id="marketBody" class="modalBody"></div>
    <div class="modalFoot"><button data-close="marketModal">← Закрыть</button></div>
  </div>
</div>
<div id="legendModal" class="modalWrap" hidden>
  <div class="modalCard" role="dialog" aria-label="Легенда">
    <div class="modalHead"><b>Легенда</b><button class="xbtn" data-close="legendModal" aria-label="Закрыть">✕</button></div>
    <div id="legendBody" class="modalBody"></div>
    <div class="modalFoot"><button data-close="legendModal">← Закрыть</button></div>
  </div>
</div>

<script src="mqtt.min.js"></script>
<script src="engine.js"></script>
<script src="render.js"></script>
<script>
"use strict";
const E = Engine;
const $ = id => document.getElementById(id);
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};
let CID = LS.get('sw-cid'); if (!CID) { CID = Math.random().toString(36).slice(2, 12); LS.set('sw-cid', CID); }
const TOPIC = 'smallworld-p100/v1/';
const MQ_URLS = (()=>{ const q=new URLSearchParams(location.search).get('mq'); return q ? [q] :
  ['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt']; })();
const MAPW=1500, MAPH=1000;
const ICO = { magic:'✨', mine:'⚒️', cave:'🦇', lost:'🏚️', fort:'🏰', lair:'🦴', camp:'⛺', hero:'🦸', dragon:'🐉', hole:'🕳️' };

let S = null, NET = { mode:'local' }, ROOM = null, MY = null;
let UI = { sel:null, g:false, lastTurnKey:'', lastScoreKey:'' };
let MAP = null, MAPSEED = null, PAINTING = null;

// ---------- утилиты ----------
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove('show'),2400); }
function show(id){ for (const s of ['lobby','room','game']) $(s).hidden = s!==id; window.scrollTo(0,0); }
function myName(){ return ($('myname').value.trim() || 'Вождь').slice(0,16); }
function genCode(){ const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<5;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }
function esc(s){ return String(s).replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function col(i){ return (E.COLORS[i]||{c:'#888888'}).c; }
function rgb(hex){ const n=parseInt(hex.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function plural(n, a, b, c){ const m=n%10, h=n%100; return n+' '+(m===1&&h!==11?a:(m>=2&&m<=4&&(h<10||h>=20))?b:c); }
function comboTitle(ri){ return E.POWERS[ri.power].name+' '+E.RACES[ri.race].name.toLowerCase(); }

// ---------- лобби ----------
$('myname').value = LS.get('sw-name') || '';
$('myname').addEventListener('change', ()=>LS.set('sw-name', myName()));
let npSel = LS.get('sw-np') || 2;
$('npSel').innerHTML = [2,3,4,5].map(n=>`<label><input type="radio" name="np" value="${n}" ${n===npSel?'checked':''}><span>${n}</span></label>`).join('');
$('npSel').addEventListener('change', e=>{ npSel=+e.target.value; LS.set('sw-np', npSel); });

function renderResume(){
  const h=[], loc=LS.get('sw-local'), host=LS.get('sw-host'), cl=LS.get('sw-client');
  if (loc && loc.S && !loc.S.over) h.push(`<button id="rLocal" style="width:100%;margin-bottom:8px">▶ Продолжить игру на этом телефоне</button>`);
  if (host && host.code) h.push(`<button id="rHost" class="pri" style="width:100%;margin-bottom:8px">▶ Вернуться в свою комнату ${host.code}</button>`);
  if (cl && cl.code && (!host || host.code!==cl.code)) h.push(`<button id="rClient" class="pri" style="width:100%;margin-bottom:8px">▶ Вернуться в комнату ${cl.code}</button>`);
  $('resume').innerHTML = h.join('');
  if ($('rLocal')) $('rLocal').onclick = ()=>{ S=loc.S; NET={mode:'local'}; MY=null; startGameUI(); };
  if ($('rHost')) $('rHost').onclick = ()=>{ if (typeof mqtt==='undefined') return toast('Сетевая библиотека не загрузилась'); LS.set('sw-name', myName()); ROOM=host.room; S=host.S; becomeHost(host.code); };
  if ($('rClient')) $('rClient').onclick = ()=>joinRoom(cl.code);
}
$('bLocal').onclick = ()=>{
  const loc=LS.get('sw-local');
  if (loc && loc.S && !loc.S.over && !confirm('Начать новую игру? Незаконченная партия на этом телефоне будет удалена.')) return;
  LS.set('sw-name', myName());
  const names = Array.from({length:npSel},(_,i)=> i===0 ? myName() : 'Игрок '+(i+1));
  S = E.newGame(names); NET={mode:'local'}; MY=null; saveLocal(); startGameUI();
};
$('bHost').onclick = ()=>{
  if (typeof mqtt==='undefined') return toast('Сетевая библиотека не загрузилась, обновите страницу');
  LS.set('sw-name', myName());
  ROOM={ code:genCode(), np:npSel, seats:Array(npSel).fill(null), started:false };
  ROOM.seats[0]={ name:myName(), cid:CID };
  S=null; becomeHost(ROOM.code);
};
$('bJoin').onclick = ()=>{
  const code=$('joincode').value.trim().toUpperCase();
  if (code.length<4) return toast('Введите код комнаты');
  LS.set('sw-name', myName()); joinRoom(code);
};
$('bLeave').onclick = ()=>leaveNet();
$('bStart').onclick = ()=>{
  if (NET.mode!=='host') return;
  if (ROOM.seats.some(s=>!s)) return toast('Ещё не все игроки зашли');
  S = E.newGame(ROOM.seats.map(s=>s.name));
  ROOM.started=true; saveHost(); broadcast(); startGameUI();
};

function renderRoom(){
  if (!ROOM) return;
  $('roomcode').textContent = ROOM.code;
  $('hostShare').hidden = NET.mode!=='host';
  $('roomlink').textContent = joinLink(ROOM.code);
  $('roommode').textContent = ROOM.np ? 'Игроков: ' + ROOM.np : '';
  const on = seatsOnline();
  $('seats').innerHTML = ROOM.seats.map((s,i)=>`<div class="seat"><span><span class="sw" style="background:${E.COLORS[i].c}"></span><span class="dot ${s?(on[i]?'ok':'wait'):''}"></span>${s?esc(s.name):'— ждём игрока…'}${i===MY?' (вы)':''}</span></div>`).join('');
  const full = ROOM.seats.length>0 && ROOM.seats.every(Boolean);
  $('bStart').hidden = NET.mode!=='host';
  $('bStart').disabled = !full;
  $('roommsg').textContent = NET.mode==='host'
    ? (full ? 'Все на месте — можно начинать!' : 'Отправьте приглашение. Игрок откроет ссылку и нажмёт «Войти».')
    : clientStatus();
}
function joinLink(code){ return location.origin + location.pathname + '#' + code; }
$('bShare').onclick = async ()=>{
  const url=joinLink(ROOM.code), text='Сыграем в «Маленький мир»? Код комнаты: '+ROOM.code;
  try { if (navigator.share) { await navigator.share({ title:'Маленький мир', text, url }); return; } } catch(e){ if (e.name==='AbortError') return; }

// ---------- сеть: публичные MQTT-серверы (несколько параллельно), как в «Шакале» ----------
function mkId(){ return Math.random().toString(36).slice(2,10); }
const SEEN_IDS = new Set();
function dupe(id){ if (!id) return false; if (SEEN_IDS.has(id)) return true; SEEN_IDS.add(id); if (SEEN_IDS.size>800) SEEN_IDS.clear(); return false; }
const KEYS = {};
const b64 = u8 => { let t=''; for (let i=0;i<u8.length;i++) t+=String.fromCharCode(u8[i]); return btoa(t); };

// Ключ шифрования и скрытое имя канала выводятся из кода комнаты: без кода сообщения не прочитать и не подделать
function roomKey(code){
  if (KEYS[code]) return KEYS[code];
  return KEYS[code] = (async()=>{
    const enc=new TextEncoder();
    const base=await crypto.subtle.importKey('raw', enc.encode('sw-room:'+code), 'PBKDF2', false, ['deriveBits']);
    const bits=new Uint8Array(await crypto.subtle.deriveBits({ name:'PBKDF2', salt:enc.encode('smallworld-p100/v1'), iterations:120000, hash:'SHA-256' }, base, 512));
    const key=await crypto.subtle.importKey('raw', bits.slice(0,32), 'AES-GCM', false, ['encrypt','decrypt']);
    const topic=Array.from(bits.slice(32,48), x=>x.toString(16).padStart(2,'0')).join('');
    return { key, topic };
  })();
}
function netOpen(code, subs, onMsg, onConnect){
  let clients=[], K=null, base='';
  const ready = roomKey(code).then(k=>{

      let c;
      try { c = mqtt.connect(url, { clientId:'sw_'+mkId()+mkId(), clean:true, reconnectPeriod:3000, connectTimeout:10000, keepalive:20 }); }
      catch(e){ return null; }
      c.on('connect', ()=>{ c.subscribe(subs.map(s=>base+s)); refreshNet(); if (onConnect) onConnect(); });
      c.on('message', async (topic, payload)=>{
        let m;
        try { const raw=unb64(payload.toString()); const pt=await crypto.subtle.decrypt({ name:'AES-GCM', iv:raw.slice(0,12) }, K.key, raw.slice(12));
              m=JSON.parse(new TextDecoder().decode(pt)); } catch(e){ return; }

      obj.id = obj.id || mkId();

      const ct=new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, K.key, new TextEncoder().encode(JSON.stringify(obj))));
      const msg=new Uint8Array(12+ct.length); msg.set(iv); msg.set(ct,12);

    end(){ ready.then(()=>clients.forEach(c=>{ try{ c.end(true); }catch(e){} })); },

}
// Проверка присланного состояния: только известные расы, способности и разумные числа
function validState(X){

    if (!X || !Array.isArray(X.P) || !Array.isArray(X.O) || !Array.isArray(X.R) || X.O.length!==X.R.length) return false;
    if (!(X.np>=2 && X.np<=5) || X.P.length!==X.np) return false;
    for (const pl of X.P){ if (typeof pl.name!=='string' || !Number.isFinite(pl.coins) || !Array.isArray(pl.races)) return false;
      for (const ri of pl.races) if (!E.RACES[ri.race] || !E.POWERS[ri.power] || !Number.isFinite(ri.hand)) return false; }
    for (const o of X.O) if (o && ((o.race!=='lost' && !E.RACES[o.race]) || !Number.isFinite(o.n) || !Number.isInteger(o.p))) return false;
    for (const c of X.shown||[]) if (!E.RACES[c.race] || !E.POWERS[c.power]) return false;
    for (const R of X.R) if (!E.TERR[R.terr] || !Number.isFinite(R.ax) || !Number.isFinite(R.ay)) return false;
    if (!Array.isArray(X.log)) return false;

}

function renderSVG(){
  let defs='<defs><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="1.5" dy="3" stdDeviation="2.2" flood-color="#000" flood-opacity=".6"/></filter>'+
    '<filter id="gray"><feColorMatrix type="saturate" values="0.15"/></filter>'+
    '<radialGradient id="face" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".7" stop-color="#e8d9b5"/><stop offset="1" stop-color="#b59c6c"/></radialGradient>'+
    '<radialGradient id="faceD" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#d9d4c8"/><stop offset=".7" stop-color="#a69f90"/><stop offset="1" stop-color="#6f685a"/></radialGradient>'+
    '<radialGradient id="gl" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#bdb6a8"/><stop offset=".6" stop-color="#7d766a"/><stop offset="1" stop-color="#3f3a33"/></radialGradient>'+
    '<radialGradient id="spec" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c9b78f"/></radialGradient>';
  S.P.forEach((pl,i)=>{ const c=col(i);
    defs+=`<radialGradient id="g${i}" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".22" stop-color="${c}"/><stop offset="1" stop-color="#000" stop-opacity=".9"/></radialGradient>`+
          `<radialGradient id="gd${i}" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#ddd"/><stop offset=".3" stop-color="${c}" stop-opacity=".55"/><stop offset="1" stop-color="#222"/></radialGradient>`; });
  defs+='</defs>';
  const tg=myTargets(), cost={}; tg.forEach(t=>cost[t.r]=t.cost);
  let body='';
  S.R.forEach((R,r)=>{
    const x=R.ax*1000, y=R.ay*1000, o=S.O[r];
    const sp=[]; if (R.magic) sp.push(ICO.magic); if (R.mine) sp.push(ICO.mine); if (R.cave) sp.push(ICO.cave);
    const k=VIEW.ts||1, sy = o ? y-38*k : y-(cost[r]!=null?30*k:0);
    sp.forEach((e,j)=>{ const sx=x+(j-(sp.length-1)/2)*26*k;
      body+=`<g filter="url(#sh)" transform="translate(${sx} ${sy}) scale(${k}) translate(${-sx} ${-sy})"><circle cx="${sx}" cy="${sy}" r="12" fill="url(#spec)" stroke="#4a3518" stroke-width="2"/><text x="${sx}" y="${sy+1}" font-size="14" text-anchor="middle" dominant-baseline="central">${e}</text></g>`; });
    body+=tokenSVG(x, y, o, cost[r]);
  });
  $('svg').innerHTML = defs+body;
}

function regionTitle(r){
  const R=S.R[r], parts=[E.TERR[R.terr].name];
  if (R.magic) parts.push('источник магии ✨'); if (R.mine) parts.push('шахта ⚒️'); if (R.cave) parts.push('пещера 🦇');
  return parts.join(', ');
}
function occText(o){
  if (!o) return 'Пусто';
  if (o.p<0) return `${ICO.lost} Затерянное племя · 1 фишка`;
  const ri=E.raceRI(S,o.p,o.race);
  return `<span class="sw" style="background:${col(o.p)}"></span>${esc(S.P[o.p].name)} · ${E.RACES[o.race].ico} ${comboTitle(ri)}${ri.decl?' (упадок)':''} · ${plural(o.n,'фишка','фишки','фишек')}`;
}
function renderSheet(){
  const r=UI.sel;
  if (r==null || !S.R[r]){ $('sheet').innerHTML=''; return; }
  const R=S.R[r], o=S.O[r], p=actorSeat(), act=canAct();
  const notes=[];
  if (R.border) notes.push('край карты — отсюда можно начать');
  if (R.coastal) notes.push('побережье');
  if (o && o.fort) notes.push('крепость +1'); if (o && o.lair) notes.push('логово +1'); if (o && o.camp) notes.push('лагеря +'+o.camp);
  if (o && (o.hero||o.dragon||o.hole)) notes.push('неуязвима');
  if (R.terr==='mount') notes.push('горы +1 к защите');
  let h=`<div class="sheet"><div class="hd"><b>${regionTitle(r)}</b><button class="xbtn" id="sClose">✕</button></div>
    <div class="info">${occText(o)}${notes.length?'<br>'+notes.join(' · '):''}</div>`;
  const btn=[];
  if (act && S.phase==='conquer' && !S.T.final){
    const ri = UI.g ? E.raceRI(S,p,'ghouls') : E.active(S,p);
    const t = E.targets(S,p,UI.g).find(t=>t.r===r);
    const hand = E.handFor(S,p,UI.g);
    if (t && ri){
      const bers = !ri.decl && ri.power==='berserk';
      if (bers && S.T.bers==null) btn.push(`<button class="wide" disabled>Сначала бросьте кубик берсерков</button>`);
      else {
        btn.push(`<button class="pri wide" data-a="conquer" ${hand<t.cost?'disabled':''}>⚔ Захватить — ${plural(t.cost,'фишка','фишки','фишек')}</button>`);
        if (hand<t.cost && hand>=1 && !bers) btn.push(`<button class="gold wide" data-a="final">🎲 Последний захват: не хватает ${t.cost-hand}, бросить кубик</button>`);
      }
      if (!ri.decl && ri.power==='dragon' && !S.T.dragonUsed && hand>=1) btn.push(`<button class="wide" data-a="dragon">🐉 Захватить драконом (1 фишка)</button>`);
    }
    if (ri && !UI.g && E.canSorcery(S,p,r)) btn.push(`<button class="wide" data-a="sorcery">🔮 Колдовство: превратить фишку</button>`);
    if (o && o.p===p){
      const ori=E.raceRI(S,p,o.race);
      if (ori && E.isArmy(ori) && !S.T.conq.some(c=>c.race===ori.race)) btn.push(`<button class="warn wide" data-a="abandon">Покинуть область (фишки в руку)</button>`);
    }
  }
  if (act && (S.phase==='redeploy'||S.phase==='defense') && o && o.p===p){
    const ri=E.raceRI(S,p,o.race);
    if (ri && E.isArmy(ri)){
      h+=`<div class="stepper"><button data-a="minus" ${S.phase==='defense'||o.n<=1?'disabled':''}>−</button><span class="num">${o.n}</span><button data-a="plus" ${ri.hand<1?'disabled':''}>+</button>
          <button data-a="all" style="flex:1;font-size:14px" ${ri.hand<1?'disabled':''}>Всё из руки (${ri.hand})</button></div>`;
      if (S.phase==='redeploy' && !ri.decl){
        if (ri.power==='bivouacking') btn.push(`<button data-a="campMinus" ${o.camp?'':'disabled'}>⛺ Убрать лагерь</button><button data-a="campPlus">⛺ Поставить лагерь</button>`);
        if (ri.power==='fortified') btn.push(`<button class="wide" data-a="fort">🏰 ${S.T.fortAt===r?'Убрать крепость':'Построить крепость'}</button>`);
        if (ri.power==='heroic') btn.push(`<button class="wide" data-a="hero">🦸 ${o.hero?'Убрать героя':'Поставить героя'}</button>`);
      }
    }
  }
  if (btn.length) h+=`<div class="acts">${btn.join('')}</div>`;
  h+='</div>';
  $('sheet').innerHTML=h;
  $('sClose').onclick=()=>{ UI.sel=null; render(); };
  $('sheet').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a, g=UI.g||undefined;
    if (a==='conquer'||a==='final') doAct({ t:a, r, g });
    else if (a==='dragon') doAct({ t:'dragon', r });
    else if (a==='sorcery') doAct({ t:'sorcery', r });
    else if (a==='abandon') doAct({ t:'abandon', r }, true);
    else if (a==='plus') doAct({ t:'place', r, d:1 }, true);
    else if (a==='minus') doAct({ t:'place', r, d:-1 }, true);
    else if (a==='all') doAct({ t:'place', r, d:'all' }, true);
    else if (a==='campPlus') doAct({ t:'camp', r, d:1 }, true);
    else if (a==='campMinus') doAct({ t:'camp', r, d:-1 }, true);
    else if (a==='fort') doAct({ t:'fort', r }, true);
    else if (a==='hero') doAct({ t:'hero', r }, true);
  });
}
function renderSide(){
  const p=actorSeat(), pl=S.P[p], me=canAct(), T=S.T;
  // итоги
  if (S.over){
    const rank=S.P.map((x,i)=>({x,i})).sort((a,b)=>b.x.coins-a.x.coins);
    $('over').innerHTML=`<div class="over"><b>🏆 Победа: ${S.winners.map(i=>esc(S.P[i].name)).join(', ')}</b><br>`+
      rank.map((o,k)=>`${k+1}. <span class="sw" style="background:${col(o.i)}"></span>${esc(o.x.name)} — ${o.x.coins} 🪙`).join('<br>')+'</div>';
  } else $('over').innerHTML='';
  // сообщение
  const who = NET.mode==='local' ? esc(pl.name) : (p===MY ? 'Ваш ход' : esc(pl.name));
  let txt='';
  const ac=E.active(S,p);
  if (S.over) txt='Партия завершена.';
  else if (S.phase==='pick') txt = me ? 'Выберите расу: нажмите «Расы на выбор». Каждая раса выше по списку стоит на 1 монету больше.' : 'выбирает новую расу.';
  else if (S.phase==='conquer'){
    const hand=E.handFor(S,p,UI.g);
    txt = me ? `В руке: <b>${plural(hand,'фишка','фишки','фишек')}</b>. Нажмите на подсвеченную область — число на красной плашке показывает, сколько фишек нужно для захвата.`
             : `захватывает земли${ac?' ('+comboTitle(ac)+')':''}.`;
    if (S.lastDie!=null) txt+=`<br>🎲 Кубик: +${S.lastDie}`;
  } else if (S.phase==='redeploy'){
    const left=E.handsLeft(S,p).reduce((s,ri)=>s+ri.hand,0);
    txt = me ? (left ? `Перегруппировка: осталось расставить <b>${left}</b>. Нажмите на свою область и добавляйте фишки.` : 'Все фишки на местах. Можно перераспределить их или закончить ход.')
             : 'перегруппировывает войска.';
  } else if (S.phase==='defense'){
    const left=E.handsLeft(S,p).reduce((s,ri)=>s+ri.hand,0);
    txt = me ? `На вас напали! Расставьте уцелевшие фишки (<b>${left}</b>) по своим областям.` : 'расставляет уцелевшие после нападения фишки.';
  }
  $('msg').className = me ? 'me' : '';
  $('msg').style.borderLeftColor = col(p);
  $('msg').innerHTML = S.over ? txt : `<span class="who">${who}</span>${txt}`;
  renderSheet();
  // управление
  let c='';
  if (me && S.phase==='pick') c+=`<div class="acts"><button class="pri wide" id="cMarket">🧝 Выбрать расу</button></div>`;
  if (me && S.phase==='conquer'){
    const gh=E.raceRI(S,p,'ghouls');
    if (gh && gh.decl && ac) c+=`<div class="seg"><button id="gA" class="${UI.g?'':'on'}">${E.RACES[ac.race].ico} ${E.RACES[ac.race].name}</button><button id="gG" class="${UI.g?'on':''}">🧟 Упыри в упадке</button></div>`;
    if (!gh || !gh.decl || !ac) UI.g = !!(gh && gh.decl && !ac);
    c+='<div class="acts">';
    if (ac && ac.power==='berserk' && !UI.g && !T.final) c+=`<button class="gold wide" id="cBers" ${T.bers!=null?'disabled':''}>🎲 ${T.bers!=null?'Кубик: +'+T.bers:'Бросить кубик берсерков'}</button>`;
    c+=`<button class="pri wide" id="cEndC">Закончить захваты →</button>`;
    if (ac && !T.picked && !T.touched) c+=`<button class="warn wide" id="cDecl">🍂 Отправить ${E.RACES[ac.race].name.toLowerCase()} в упадок (вместо хода)</button>`;
    c+='</div>';
  }
  if (me && S.phase==='redeploy'){
    const left=E.handsLeft(S,p).length>0;
    c+='<div class="acts">';
    if (ac && ac.power==='diplomat'){
      const opts=S.P.map((x,i)=>i!==p && !T.attacked[i] ? `<option value="${i}">${esc(x.name)}</option>`:'').join('');
      c+=`<select id="cDip" class="wide"><option value="">🕊 Мир — не заключать</option>${opts}</select>`;
    }
    c+=`<button class="pri wide" id="cEndT" ${left?'disabled':''}>✔ Закончить ход</button>`;
    if (ac && ac.power==='stout') c+=`<button class="warn wide" id="cStout" ${left?'disabled':''}>🍂 Закончить ход и уйти в упадок</button>`;
    c+='</div>';
  }
  if (me && S.phase==='defense') c+=`<div class="acts"><button class="pri wide" id="cDef" ${E.handsLeft(S,p).length?'disabled':''}>✔ Готово</button></div>`;
  if (NET.waitAct) c+='<div style="color:var(--muted);font-size:13px;margin-bottom:8px">⏳ Отправляю ход…</div>';
  $('ctl').innerHTML=c;
  const on=(id,f)=>{ if ($(id)) $(id).onclick=f; };
  on('cMarket', openMarket);
  on('gA', ()=>{ UI.g=false; UI.sel=null; render(); }); on('gG', ()=>{ UI.g=true; UI.sel=null; render(); });
  on('cBers', ()=>doAct({ t:'berserk' }, true));
  on('cEndC', ()=>doAct({ t:'endConquest' }));
  on('cDecl', ()=>{ if (confirm('Отправить расу в упадок? В этот ход захватов не будет.')) doAct({ t:'decline' }); });
  const endT = stout=>{ const a={ t:'endTurn' }; const d=$('cDip'); if (d && d.value!=='') a.diplo=+d.value; if (stout) a.stout=true; doAct(a); };
  on('cEndT', ()=>endT(false)); on('cStout', ()=>{ if (confirm('Закончить ход и отправить расу в упадок?')) endT(true); });
  on('cDef', ()=>doAct({ t:'defDone' }));
  // игроки
  const v=viewer();
  $('players').innerHTML = S.P.map((x,i)=>{
    const races=x.races.map(ri=>`<div class="rc ${ri.decl?'dec':''}">${E.RACES[ri.race].ico} ${comboTitle(ri)}${ri.decl?' — упадок':''} · на карте ${E.onMap(S,ri.race)}${E.isArmy(ri)&&ri.hand?' · в руке '+ri.hand:''}</div>`).join('') || '<div class="rc">— без расы</div>';
    const coins = (S.over || i===v) ? `${x.coins} 🪙` : '🪙 ?';
    return `<div class="pl ${i===p&&!S.over?'on':''}"><div class="nm"><span><span class="sw" style="background:${col(i)}"></span>${esc(x.name)}${NET.mode!=='local'&&i===MY?' (вы)':''}</span><span>${coins}</span></div>${races}</div>`;
  }).join('');
  $('log').innerHTML = S.log.slice(-12).reverse().map(t=>`<div>${esc(t)}</div>`).join('');
  $('bAgain').hidden = !(S.over && NET.mode!=='client');
  if (!$('marketModal').hidden) renderMarket();
}
function notify(){
  // монеты за ход
  if (S.lastScore){
    const key=S.seq+':'+S.lastScore.p+':'+S.lastScore.total;
    const k2=S.lastScore.p+':'+S.round+':'+S.lastScore.total+':'+S.log.length;
    if (UI.lastScoreKey!=='' && UI.lastScoreKey!==k2){
      const ls=S.lastScore, el=$('scorePop');
      el.innerHTML=`<b>${esc(S.P[ls.p].name)}: +${ls.total} 🪙</b>`+ls.parts.map(([l,v])=>`<div><span>${esc(l)}</span><span>+${v}</span></div>`).join('');
      el.classList.add('show'); clearTimeout(notify.h); notify.h=setTimeout(()=>el.classList.remove('show'),3200);
    }
    UI.lastScoreKey=k2;
  } else if (UI.lastScoreKey==='') UI.lastScoreKey='-';
  // мой ход
  const tk=S.round+':'+S.cur+':'+S.phase+':'+S.defP;
  if (tk!==UI.lastTurnKey){
    const was=UI.lastTurnKey; UI.lastTurnKey=tk;
    if (was && NET.mode!=='local' && canAct()){ try{ navigator.vibrate && navigator.vibrate([120,60,120]); }catch(e){} toast('Ваш ход!'); }
    if (canAct() && S.phase==='pick' && window.innerWidth>0) setTimeout(()=>{ if (S && S.phase==='pick' && canAct() && $('marketModal').hidden) openMarket(); }, 350);
  }
}

// ---------- рынок рас ----------
function openMarket(){ openModal('marketModal'); renderMarket(); }
function renderMarket(){
  if (!S) return;
  const p=actorSeat(), can=canAct() && S.phase==='pick', coins=S.P[p].coins;
  $('marketBody').innerHTML = (can?`<p class="sub" style="margin:4px 0 10px">У вас ${coins} 🪙. Взять расу ниже первой стоит по 1 🪙 за каждую пропущенную — монеты остаются на них. Монеты, лежащие на расе, достаются вам.</p>`
      :`<p class="sub" style="margin:4px 0 10px">${S.phase==='pick'?esc(S.P[p].name)+' сейчас выбирает.':'Эти расы сейчас доступны.'}</p>`)+
    S.shown.map((c,i)=>{ const R=E.RACES[c.race], P=E.POWERS[c.power];
      return `<div class="combo"><div class="token">${R.ico}</div><div class="t"><b>${P.name} ${R.name.toLowerCase()}</b>
        <small><b style="font-size:12.5px">${R.name}:</b> ${R.d}</small><small><b style="font-size:12.5px">${P.name}:</b> ${P.d}</small>
        <div class="meta"><span>👥 ${Math.min(R.n+P.n,R.cap)} фишек</span><span>Цена: ${i} 🪙</span>${c.coins?`<span style="color:var(--acc)">+${c.coins} 🪙 на ней</span>`:''}</div></div>
        ${can?`<button class="pri" data-i="${i}" ${coins<i?'disabled':''}>Взять</button>`:''}</div>`; }).join('');
  $('marketBody').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ closeModal('marketModal'); doAct({ t:'pick', i:+b.dataset.i }); });
}
$('bMarket').onclick=openMarket;
// окна: открываются с записью в историю, чтобы «Назад» закрывал окно, а не уходил со страницы
function openModal(id){
  const w=$(id); if (!w.hidden) return;
  w.hidden=false;
  try { history.pushState({ modal:id }, ''); } catch(e){}
}
function closeModal(id){
  const w=$(id); if (w.hidden) return;
  w.hidden=true;
  if (history.state && history.state.modal===id){ try { history.back(); } catch(e){} }
}
window.addEventListener('popstate', ()=>{ document.querySelectorAll('.modalWrap').forEach(w=>{ if (!w.hidden && !(history.state && history.state.modal===w.id)) w.hidden=true; }); });
document.addEventListener('keydown', e=>{ if (e.key==='Escape') document.querySelectorAll('.modalWrap').forEach(w=>{ if (!w.hidden) closeModal(w.id); }); });
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
document.querySelectorAll('.modalWrap').forEach(w=>w.addEventListener('click', e=>{ if (e.target===w) closeModal(w.id); }));

  $('legendBody').innerHTML=h;
  const lt=$('legT');
  for (const [t,b,s] of terr){
    const d=document.createElement('div'); d.className='legItem sw2';
    d.innerHTML=`<div class="legIco"></div><div class="legTxt"><b>${b}</b><span>${s}</span></div>`;
    d.querySelector('.legIco').appendChild(Painter.swatch(t,176,112)); lt.appendChild(d);
  }
  openModal('legendModal');
}
$('bLegend').onclick=openLegend; $('bLegendLobby').onclick=openLegend;
const RULES = `<summary>Правила коротко</summary>
<p><b>Цель:</b> набрать больше всех монет. Ходов: вдвоём и втроём — 10, вчетвером — 9, впятером — 8.</p>
<p><b>Выбор расы.</b> Раса + способность = набор фишек. Первая в списке бесплатна, каждая следующая стоит на 1 🪙 больше.</p>
<p><b>Захват.</b> Первая область — с края карты (или у моря, выходящего к краю). Дальше — только соседние. Цена: 2 фишки + 1 за каждую фишку врага, гору, крепость, логово, лагерь. Последний захват за ход можно сделать с кубиком подкрепления (0, 0, 0, 1, 2, 3).</p>
<p><b>Враг</b>, у которого отняли область, теряет 1 фишку, остальные расставляет у себя в конце вашего хода. Раса в упадке теряет все фишки из области.</p>
<p><b>Перегруппировка.</b> После захватов фишки можно двигать между своими областями, в каждой — хотя бы одна.</p>
<p><b>Начало хода.</b> Из каждой области в руку уходят все фишки, кроме одной: ими и захватываете. Можно покинуть область целиком.</p>
<p><b>Упадок.</b> Вместо хода можно отправить расу в упадок: в каждой области остаётся по 1 фишке, они продолжают приносить монеты. Прежняя раса в упадке уходит с карты. В следующий ход выбираете новую расу и сразу ею ходите.</p>
<p><b>Монеты</b> — в конце своего хода: 1 за каждую свою область (активной расы и в упадке) плюс бонусы рас и способностей.</p>`;
$('rulesL').innerHTML=RULES; $('rulesG').innerHTML=RULES;

$('bMenu').onclick=()=>{
  if (NET.mode==='local'){ saveLocal(); show('lobby'); renderResume(); return; }
  if (confirm('Выйти в меню? Партия сохранится, вернуться можно из главного экрана.')) leaveNet();
};
$('bAgain').onclick=()=>{
  if (NET.mode==='local'){ S=E.newGame(S.P.map(p=>p.name)); saveLocal(); startGameUI(); return; }
  if (NET.mode==='host'){ S=E.newGame(ROOM.seats.map(s=>s.name)); ROOM.started=true; saveHost(); broadcast(); startGameUI(); }
};

// ---------- старт ----------
renderResume();
if (location.hash.length>=5){ const code=location.hash.slice(1).toUpperCase(); $('joincode').value=code; }
</script>
