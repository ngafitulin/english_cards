<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1f2b">
<title>Шакал — пиратская игра онлайн</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☠</text></svg>">
<style>
:root{
  --cell:clamp(20px,calc((100vw - 14px)/13),58px);
  --panel:#132f3f;--card:#0c2433;--txt:#e9f1f5;--muted:#9fb6c3;--acc:#f5c518;--pri:#1f9d6b;
}
@media (min-width:860px){:root{--cell:clamp(24px,min(calc((100vw - 400px)/13),calc((100vh - 30px)/13)),58px)}}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#0a1f2b}
body{background:radial-gradient(ellipse at top,#16465f,#0a1f2b 70%) fixed;color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}
button{font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:0;background:#2a5872;color:#fff;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){filter:brightness(1.12)}
button:disabled{opacity:.35;cursor:default}
button.pri{background:var(--pri);font-weight:600}
button.warn{background:#7a3b2a}
button.on{background:#b8860b}
input{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid #2f5b73;background:#0a1d29;color:#fff;width:100%}
.screen{max-width:520px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:34px;margin:6px 0 2px;letter-spacing:.5px}
h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--panel);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px #0005}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
.fld{display:block;margin-bottom:12px;color:var(--muted);font-size:14px}.fld input{margin-top:4px}
.mode{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--card);margin-bottom:6px;cursor:pointer}
.mode input{width:auto;margin:0}
.mode small{display:block;color:var(--muted);font-size:12px}
.code{font-size:44px;font-weight:800;letter-spacing:8px;text-align:center;color:var(--acc);margin:4px 0 10px;font-family:ui-monospace,Menlo,monospace}
.link{font-size:12px;color:var(--muted);word-break:break-all;text-align:center;margin:6px 0}
.seat{display:flex;justify-content:space-between;padding:9px 12px;background:var(--card);border-radius:10px;margin-bottom:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555;margin-right:6px}
.dot.ok{background:#34d399}.dot.wait{background:#f59e0b}
#roommsg,#netmsg{color:var(--muted);font-size:14px;margin:8px 0}
/* game */
.wrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-start;padding:7px}
.board{display:grid;grid-template-columns:repeat(13,var(--cell));grid-template-rows:repeat(13,var(--cell));
  gap:1px;padding:4px;background:#0d3d56;border-radius:12px;box-shadow:0 10px 30px #0008}
.c{position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*.5);
  line-height:1;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;border-radius:4px}
.w{background:#1f6d92;border-radius:0;background-image:radial-gradient(circle at 30% 40%,#ffffff12 0 18%,transparent 19%)}
.hid{background:repeating-linear-gradient(45deg,#c99d55 0 5px,#bf9248 5px 10px);box-shadow:inset 0 0 0 1px #8a6630}
.rev{background:#f2e6c2;box-shadow:inset 0 0 0 1px #c9b27a}
.v1{background:#efe2b8}.v2{background:#f4e9c9}.v3{background:#ece0b4}
.g-bad{background:#f2c7b5}.g-slow{background:#d9e8bf}.g-gold{background:#fbe48f}.g-safe{background:#cfdbe3}.g-move{background:#f7ddb0}
.ship{font-size:calc(var(--cell)*.6);border-radius:7px}
.arw{width:82%;height:82%}
.n{position:absolute;top:1px;left:3px;font-size:calc(var(--cell)*.24);font-weight:800;color:#3a5a1a}
.cn{position:absolute;top:1px;right:1px;min-width:calc(var(--cell)*.32);height:calc(var(--cell)*.32);border-radius:99px;
  background:var(--acc);color:#4a3500;border:1px solid #9a7a00;font-size:calc(var(--cell)*.21);font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 2px;z-index:3}
.faded{opacity:.3}
.lastp::before{content:"";position:absolute;inset:2px;border:2px dashed #fde04799;border-radius:5px;pointer-events:none}
.dest,.opt,.smv{cursor:pointer}
.dest::after,.opt::after,.smv::after{content:"";position:absolute;inset:0;border-radius:5px;pointer-events:none;animation:pulse 1.1s infinite}
.dest::after{box-shadow:inset 0 0 0 3px #34d399;background:#34d39933}
.opt::after{box-shadow:inset 0 0 0 4px #f59e0b;background:#f59e0b44}
.smv::after{box-shadow:inset 0 0 0 3px #60a5fa;background:#60a5fa33}
@keyframes pulse{50%{opacity:.35}}
.toks{position:absolute;inset:0;display:flex;flex-wrap:wrap-reverse;align-content:flex-start;align-items:flex-end;justify-content:center;
  gap:1px;padding:1px;pointer-events:none;z-index:2}
.pir{position:relative;width:calc(var(--cell)*.4);height:calc(var(--cell)*.4);border-radius:50%;border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*.2);font-weight:800;box-shadow:0 1px 3px #000a;pointer-events:auto}
.pir.light{border-color:#333}
.pir.own{cursor:pointer}
.pir.sel{box-shadow:0 0 0 3px #fde047,0 1px 4px #000;transform:scale(1.2);z-index:5}
.pir.lc{box-shadow:0 0 0 3px var(--acc),0 1px 3px #000a}
.pir.lc::after{content:"🪙";position:absolute;bottom:-7px;left:-7px;font-size:calc(var(--cell)*.26);line-height:1;filter:drop-shadow(0 0 1px #000)}
.panel{width:min(360px,100%);background:var(--panel);border-radius:14px;padding:12px;box-shadow:0 10px 30px #0006}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.top b{font-size:18px}
.net{font-size:12px;color:var(--muted)}
.pl{background:var(--card);border-radius:10px;padding:7px 9px;margin-bottom:6px;border:2px solid transparent}
.pl.on{border-color:var(--acc)}
.pl .nm{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.tm{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:3px}
.tm .sw{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}
.tm.cur{color:#fff;font-weight:700}
#msg{min-height:44px;background:var(--card);border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0;line-height:1.4}
#msg.me{box-shadow:inset 0 0 0 2px #34d399}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.acts .wide{grid-column:span 2}
#log{font-size:12.5px;line-height:1.45;opacity:.85;max-height:150px;overflow:auto;margin-bottom:8px}
#log div{border-bottom:1px solid #ffffff12;padding:2px 0}
details{font-size:13px;line-height:1.5;background:var(--card);border-radius:10px;padding:8px 10px;margin-top:6px}
summary{cursor:pointer;font-weight:600}
.leg{display:grid;grid-template-columns:28px 1fr;gap:4px 6px;margin-top:6px;align-items:center}
.leg span:nth-child(odd){text-align:center;font-size:18px}
.over{background:#3d2f05;border:2px solid var(--acc);border-radius:10px;padding:10px;margin-bottom:8px;font-size:16px;text-align:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111c;color:#fff;padding:10px 16px;border-radius:10px;
  font-size:14px;z-index:99;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
button.help{width:34px;height:34px;padding:0;border-radius:50%;background:#2a5872;font-size:18px;font-weight:800;flex-shrink:0}
.modalWrap{position:fixed;inset:0;background:#000b;z-index:90;display:flex;align-items:flex-end;justify-content:center;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
@media (min-width:640px){.modalWrap{align-items:center}}
.modalCard{background:var(--panel);width:100%;max-width:560px;max-height:88vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px #0008}
@media (min-width:640px){.modalCard{border-radius:16px;max-height:80vh}}
.modalHead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #ffffff1a;font-size:18px}
.xbtn{width:32px;height:32px;padding:0;border-radius:50%;background:#0c2433;font-size:16px}
.modalBody{overflow:auto;padding:10px 16px 18px}
.legItem{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #ffffff14}
.legItem:last-child{border-bottom:0}
.legIco{font-size:34px;line-height:1;width:44px;text-align:center;flex-shrink:0}
.legTxt b{display:block;font-size:16px;margin-bottom:2px}
.legTxt span{font-size:14px;color:var(--muted);line-height:1.4}
</style>
</head>
<body>

<section id="lobby" class="screen">
  <h1>☠ Шакал</h1>
  <p class="sub">Классическая пиратская настолка. Можно на одном телефоне или каждый со своего.</p>
  <label class="fld">Ваше имя<input id="myname" maxlength="16" placeholder="Капитан"></label>
  <div id="resume"></div>
  <div class="card">
    <h2>Новая игра</h2>
    <div id="modes"></div>
    <div class="row"><button id="bLocal">На одном телефоне</button><button id="bHost" class="pri">Онлайн-комната</button></div>
  </div>
  <div class="card">
    <h2>Присоединиться по коду</h2>
    <div class="row"><input id="joincode" placeholder="КОД" maxlength="5" autocapitalize="characters" autocomplete="off"><button id="bJoin" class="pri">Войти</button></div>
  </div>
  <div class="card">
    <button id="bLegendLobby" style="width:100%;margin-bottom:10px">❔ Что означают клетки на поле</button>
    <details id="rulesL"></details>
  </div>
</section>

<section id="room" class="screen" hidden>
  <div class="card">
    <h2>Комната</h2>
    <div class="code" id="roomcode"></div>
    <div id="hostShare">
      <button id="bShare" class="pri" style="width:100%">Отправить приглашение</button>
      <div class="link" id="roomlink"></div>
    </div>
    <div id="roommode" class="sub" style="margin:8px 0"></div>
    <div id="seats"></div>
    <div id="roommsg"></div>
    <div class="row"><button id="bLeave">Выйти</button><button id="bStart" class="pri">Начать игру</button></div>
  </div>
</section>

<section id="game" hidden>
  <div class="wrap">
    <div class="board" id="board"></div>
    <div class="panel">
      <div class="top"><b>☠ Шакал</b><span style="display:flex;align-items:center;gap:8px"><span class="net" id="net"></span><button id="bLegendTop" class="help" title="Что означают клетки" aria-label="Легенда клеток">❔</button></span></div>
      <div id="over"></div>
      <div id="players"></div>
      <div id="msg"></div>
      <div class="acts">
        <button id="bRevive" class="wide pri" hidden>🏯 Воскресить пирата (тратит ход)</button>
      </div>
      <div id="log"></div>
      <div class="acts">
        <button id="bMenu">Меню</button>
        <button id="bEnd" class="warn">Закончить игру</button>
        <button id="bAgain" class="wide pri" hidden>Новая партия</button>
      </div>
      <details id="rulesG"></details>
    </div>
  </div>
</section>
<div id="toast"></div>
<div id="legendModal" class="modalWrap" hidden>
  <div class="modalCard" role="dialog" aria-label="Что означают клетки">
    <div class="modalHead"><b>Что означают клетки</b><button id="bLegendClose" class="xbtn" aria-label="Закрыть">✕</button></div>
    <div id="legendBody" class="modalBody"></div>
  </div>
</div>

<script src="mqtt.min.js"></script>
<script src="engine.js"></script>
<script>
"use strict";
const E = Engine;
const $ = id => document.getElementById(id);
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};
let CID = LS.get('shk-cid'); if (!CID) { CID = Math.random().toString(36).slice(2, 12); LS.set('shk-cid', CID); }
const TOPIC = 'shakal-p100/v2/';
const MQ_URLS = (()=>{ const q=new URLSearchParams(location.search).get('mq'); return q ? [q] :
  ['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt']; })();

let S = null;              // состояние партии
let NET = { mode: 'local' }; // local | host | client
let ROOM = null;           // {code, mode, seats:[{name,cid}|null], started}
let MY = null;             // мой номер игрока (онлайн)
let UI = { sel: null, ship: false, confirmEnd: false, lastTurnKey: '' };

// ---------- утилиты ----------
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove('show'),2200); }
function show(id){ for (const s of ['lobby','room','game']) $(s).hidden = s!==id; window.scrollTo(0,0); }
function myName(){ return ($('myname').value.trim() || 'Капитан').slice(0,16); }
function genCode(){ const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<5;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }
function esc(s){ return String(s).replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function teamColor(ti){ return E.TEAM_INFO[S.teams[ti].pos]; }

// ---------- лобби ----------
$('myname').value = LS.get('shk-name') || '';
$('myname').addEventListener('change', ()=>LS.set('shk-name', myName()));
let modeSel = LS.get('shk-mode') || '2x1';
$('modes').innerHTML = Object.entries(E.MODES).map(([k,m]) =>
  `<label class="mode"><input type="radio" name="mode" value="${k}" ${k===modeSel?'checked':''}><span>${m.label}<small>${modeHint(k)}</small></span></label>`).join('');
function modeHint(k){
  return {'2x1':'Корабли друг напротив друга, по 3 пирата',
          '2x2':'4 корабля, у каждого по 6 пиратов с двух сторон острова',
          'p3':'3 корабля','p4':'4 корабля','2v2':'Союзники ходят через одного, монеты общие'}[k];
}
$('modes').addEventListener('change', e=>{ modeSel=e.target.value; LS.set('shk-mode', modeSel); });

function renderResume(){
  const h=[], loc=LS.get('shk-local'), host=LS.get('shk-host'), cl=LS.get('shk-client');
  if (loc && loc.S && !loc.S.over) h.push(`<button id="rLocal" style="width:100%;margin-bottom:8px">▶ Продолжить игру на этом телефоне</button>`);
  if (host && host.code) h.push(`<button id="rHost" class="pri" style="width:100%;margin-bottom:8px">▶ Вернуться в свою комнату ${host.code}</button>`);
  if (cl && cl.code && (!host || host.code!==cl.code)) h.push(`<button id="rClient" class="pri" style="width:100%;margin-bottom:8px">▶ Вернуться в комнату ${cl.code}</button>`);
  $('resume').innerHTML = h.join('');
  if ($('rLocal')) $('rLocal').onclick = ()=>{ S=loc.S; NET={mode:'local'}; MY=null; startGameUI(); };
  if ($('rHost')) $('rHost').onclick = ()=>{ if (typeof mqtt==='undefined') return toast('Сетевая библиотека не загрузилась'); LS.set('shk-name', myName()); ROOM=host.room; S=host.S; becomeHost(host.code); };
  if ($('rClient')) $('rClient').onclick = ()=>joinRoom(cl.code);
}
$('bLocal').onclick = ()=>{
  LS.set('shk-name', myName());
  const M=E.MODES[modeSel];
  S = E.newGame(modeSel, Array.from({length:M.players},(_,i)=>'Игрок '+(i+1)));
  NET={mode:'local'}; MY=null; saveLocal(); startGameUI();
};
$('bHost').onclick = ()=>{
  if (typeof mqtt==='undefined') return toast('Сетевая библиотека не загрузилась, обновите страницу');
  LS.set('shk-name', myName());
  const M=E.MODES[modeSel];
  ROOM={ code:genCode(), mode:modeSel, seats:Array(M.players).fill(null), started:false };
  ROOM.seats[0]={ name:myName(), cid:CID };
  S=null; becomeHost(ROOM.code);
};
$('bJoin').onclick = ()=>{
  const code=$('joincode').value.trim().toUpperCase();
  if (code.length<4) return toast('Введите код комнаты');
  LS.set('shk-name', myName()); joinRoom(code);
};
$('bLeave').onclick = leaveNet;
$('bStart').onclick = ()=>{
  if (NET.mode!=='host') return;
  if (ROOM.seats.some(s=>!s)) return toast('Ещё не все игроки зашли');
  S = E.newGame(ROOM.mode, ROOM.seats.map(s=>s.name));
  ROOM.started=true; saveHost(); broadcast(); startGameUI();
};

function renderRoom(){
  if (!ROOM) return;
  const M=E.MODES[ROOM.mode];
  $('roomcode').textContent = ROOM.code;
  $('hostShare').hidden = NET.mode!=='host';
  $('roomlink').textContent = joinLink(ROOM.code);
  $('roommode').textContent = 'Режим: ' + M.label;
  const on = seatsOnline();
  $('seats').innerHTML = ROOM.seats.map((s,i)=>{
    const teams=M.teams.filter(t=>t[1]===i).map(t=>E.TEAM_INFO[t[0]].name).join(' + ');
    return `<div class="seat"><span><span class="dot ${s?(on[i]?'ok':'wait'):''}"></span>${s?esc(s.name):'— ждём игрока…'}${i===MY?' (вы)':''}</span><small style="color:var(--muted)">${teams}</small></div>`;
  }).join('');
  const full = ROOM.seats.every(Boolean);
  $('bStart').hidden = NET.mode!=='host';
  $('bStart').disabled = !full;
  $('roommsg').textContent = NET.mode==='host'
    ? (full ? 'Все на месте — можно начинать!' : 'Отправьте приглашение. Игрок откроет ссылку и нажмёт «Войти».')
    : clientStatus();
}
function joinLink(code){ return location.origin + location.pathname + '#' + code; }
$('bShare').onclick = async ()=>{
  const url=joinLink(ROOM.code), text='Сыграем в Шакал? Код комнаты: '+ROOM.code;
  try { if (navigator.share) { await navigator.share({ title:'Шакал', text, url }); return; } } catch(e){ if (e.name==='AbortError') return; }
  try { await navigator.clipboard.writeText(text+'\n'+url); toast('Ссылка скопирована'); } catch(e){ toast('Скопируйте ссылку под кнопкой'); }
};

// ---------- сеть: обмен через публичные MQTT-серверы (несколько параллельно) ----------
function mkId(){ return Math.random().toString(36).slice(2,10); }
const SEEN_IDS = new Set();
function dupe(id){ if (!id) return false; if (SEEN_IDS.has(id)) return true; SEEN_IDS.add(id); if (SEEN_IDS.size>800) SEEN_IDS.clear(); return false; }
function netOpen(code, subs, onMsg, onConnect){
  const base = TOPIC + code;
  const clients = MQ_URLS.map(url=>{
    let c;
    try { c = mqtt.connect(url, { clientId:'shk_'+CID+'_'+mkId(), clean:true, reconnectPeriod:3000, connectTimeout:10000, keepalive:20 }); }
    catch(e){ return null; }
    c.on('connect', ()=>{ c.subscribe(subs.map(s=>base+s)); refreshNet(); if (onConnect) onConnect(); });
    c.on('message', (topic, payload)=>{ let m; try { m = JSON.parse(payload.toString()); } catch(e){ return; }
      if (!m || typeof m!=='object' || dupe(m.id)) return; onMsg(topic.slice(base.length), m); });
    ['close','offline','reconnect'].forEach(ev=>c.on(ev, refreshNet));
    c.on('error', ()=>{});
    return c;
  }).filter(Boolean);
  return {
    pub(sub, obj, retain){ obj.id = obj.id || mkId(); const s = JSON.stringify(obj);
      clients.forEach(c=>{ if (c.connected) c.publish(base+sub, s, { qos:0, retain:!!retain }); }); },
    connected(){ return clients.some(c=>c.connected); },
    wake(){ clients.forEach(c=>{ if (!c.connected) { try{ c.reconnect(); }catch(e){} } }); },
    end(){ clients.forEach(c=>{ try{ c.end(true); }catch(e){} }); },
  };
}

// ----- хост -----
function becomeHost(code){
  const saved = LS.get('shk-host');
  NET = { mode:'host', code, seen:{}, ver:(saved && saved.code===code && saved.ver) || 0 };
  MY = 0;
  saveHost();
  NET.link = netOpen(code, ['/up'], onHostMsg, ()=>broadcast());
  if (ROOM.started && S) startGameUI(); else { show('room'); renderRoom(); }
}
function onHostMsg(sub, m){
  if (sub!=='/up' || !m.cid) return;
  const was = seatsOnline().join();
  NET.seen[m.cid] = Date.now();
  if (m.t==='hello') {
    const name = String(m.name||'Игрок').slice(0,16);
    let seat = ROOM.seats.findIndex(s=>s && s.cid===m.cid);
    const fresh = seat<0;
    if (seat<0 && !ROOM.started) { seat = ROOM.seats.findIndex(s=>!s); if (seat>=0) ROOM.seats[seat]={ name, cid:String(m.cid) }; }
    if (seat>=0 && !ROOM.started) ROOM.seats[seat].name = name;
    NET.link.pub('/to/'+m.cid, { t:'welcome', seat: seat>=0 ? seat : null });
    if (fresh && seat>=0) toast(ROOM.seats[seat].name+' в игре');
    saveHost(); broadcast(); refresh();
    return;
  }
  if (m.t==='act' && ROOM.started && S) {
    const seat = ROOM.seats.findIndex(s=>s && s.cid===m.cid);
    if (seat<0) return;
    const err = E.act(S, seat, m.a);
    if (err) NET.link.pub('/to/'+m.cid, { t:'err', err });
    else afterChange();
    return;
  }
  if (seatsOnline().join()!==was) { hostBeat(); refresh(); }
}
function seatsOnline(){
  if (!ROOM) return [];
  if (NET.mode==='host') { const now=Date.now();
    return ROOM.seats.map((s,i)=> i===0 || !!(s && NET.seen[s.cid] && now-NET.seen[s.cid]<15000)); }
  return NET.roomOn || ROOM.seats.map(()=>false);
}
function broadcast(){
  if (NET.mode!=='host' || !NET.link) return;
  NET.ver = Math.max(NET.ver+1, Date.now());
  saveHost();
  NET.link.pub('/state', { ver:NET.ver, room:{ code:ROOM.code, mode:ROOM.mode, started:ROOM.started, seats:ROOM.seats.map(s=>s&&{name:s.name}) }, on:seatsOnline(), S }, true);
}
function hostBeat(){ if (NET.mode==='host' && NET.link) NET.link.pub('/hb', { on:seatsOnline(), ver:NET.ver }); }

// ----- гость -----
function joinRoom(code){
  if (typeof mqtt==='undefined') return toast('Сетевая библиотека не загрузилась, обновите страницу');
  leaveNet(true);
  NET = { mode:'client', code, ver:0, welcomed:false, lastHb:0, start:Date.now() };
  MY = null; S = null;
  ROOM = { code, mode:'2x1', seats:[], started:false };
  LS.set('shk-client', { code });
  show('room'); renderRoom();
  const hello = ()=>NET.link && NET.link.pub('/up', { t:'hello', cid:CID, name:myName() });
  NET.link = netOpen(code, ['/state','/hb','/to/'+CID], onClientMsg, hello);
}
function onClientMsg(sub, m){
  if (sub==='/hb') { NET.lastHb=Date.now(); NET.roomOn=m.on; if (m.ver>NET.ver && NET.link) {/* состояние придёт отдельно */} refreshNet(); return; }
  if (sub==='/to/'+CID) {
    if (m.t==='welcome') { NET.welcomed=true; MY=m.seat; NET.lastHb=Date.now(); refresh(); }
    else if (m.t==='err') { NET.waitAct=null; toast(m.err); render(); }
    return;
  }
  if (sub==='/state') {
    if (!m.ver || m.ver<=NET.ver) return;
    NET.ver = m.ver; NET.roomOn = m.on;
    ROOM = { code:m.room.code, mode:m.room.mode, seats:m.room.seats, started:m.room.started };
    const prevSeq = S && S.seq;
    S = m.S; NET.waitAct = null;
    if (ROOM.started && S) { if ($('game').hidden) startGameUI(); else { if (prevSeq!==S.seq) { UI.sel=null; UI.ship=false; } render(); } }
    else { S=null; show('room'); renderRoom(); }
  }
}
function hostAlive(){ return NET.mode!=='client' || Date.now()-NET.lastHb < 13000; }
function clientStatus(){
  if (!NET.link || !NET.link.connected()) return 'Подключаюсь к серверу… Если это долго — проверьте интернет.';
  if (!hostAlive()) return Date.now()-NET.start<9000 ? 'Ищу комнату '+NET.code+'…'
    : 'Создатель комнаты сейчас не в сети. Пусть откроет игру у себя и не сворачивает её — подключение произойдёт само.';
  if (!NET.welcomed) return 'Вхожу в комнату…';
  if (MY==null) return 'Комната заполнена — вы зритель.';
  return 'Вы в комнате. Ждём, пока создатель начнёт игру…';
}
function refreshNet(){ const el=$('net'); if (el) el.innerHTML = netBadge(); if (!$('room').hidden) renderRoom(); }
function netBadge(){
  if (NET.mode==='local') return 'один телефон';
  const conn = NET.link && NET.link.connected();
  let txt, ok=false;
  if (!conn) txt='нет связи, переподключаюсь…';
  else if (NET.mode==='client' && !hostAlive()) txt='создатель не в сети';
  else { txt='онлайн'; ok=true; }
  return `<span class="dot ${ok?'ok':'wait'}"></span>${NET.mode==='host'?'комната '+NET.code+' · ':''}${txt}`;
}
function leaveNet(silent){
  try { if (NET.link) NET.link.end(); } catch(e){}
  NET = { mode:'local' };
  if (silent!==true) { show('lobby'); renderResume(); }
}
setInterval(()=>{
  if (NET.mode==='host') hostBeat();
  else if (NET.mode==='client' && NET.link) {
    if (!NET.welcomed) NET.link.pub('/up', { t:'hello', cid:CID, name:myName() });
    else NET.link.pub('/up', { t:'ping', cid:CID });
    if (NET.waitAct && Date.now()-NET.waitAct>8000) { NET.waitAct=null; toast('Ход не дошёл до создателя комнаты — повторите'); }
  }
  if (NET.mode!=='local') refreshNet();
}, 4000);
document.addEventListener('visibilitychange', ()=>{
  if (document.visibilityState!=='visible' || !NET.link) return;
  NET.link.wake();
  if (NET.mode==='client') NET.lastHb = Math.max(NET.lastHb, Date.now()-9000);
  if (NET.mode==='host') setTimeout(()=>{ broadcast(); }, 1500);
});

// ---------- сохранение ----------
function saveLocal(){ LS.set('shk-local', { S }); }
function saveHost(){ if (NET.mode==='host') LS.set('shk-host', { code:NET.code, room:ROOM, S, ver:NET.ver }); }

// ---------- действия ----------
function canAct(){ return S && !S.over && (NET.mode==='local' || (MY!=null && S.teams[S.turn].player===MY)); }
function doAct(a){
  if (NET.mode==='client') {
    if (!NET.link || !NET.link.connected()) return toast('Нет связи — подождите пару секунд');
    if (!hostAlive()) return toast('Создатель комнаты не в сети');
    NET.link.pub('/up', { t:'act', cid:CID, a }); NET.waitAct=Date.now(); UI.sel=null; UI.ship=false; render(); return;
  }
  const err = E.act(S, NET.mode==='host' ? 0 : null, a);
  if (err) return toast(err);
  afterChange();
}
function afterChange(){
  UI.sel=null; UI.ship=false; UI.confirmEnd=false;
  if (NET.mode==='local') saveLocal(); else { saveHost(); broadcast(); }
  render();
}
function refresh(){ if (!$('room').hidden) renderRoom(); else if (!$('game').hidden) render(); }

// ---------- игра: отрисовка ----------
function startGameUI(){ UI={ sel:null, carry:true, ship:false, confirmEnd:false, lastTurnKey:'' }; show('game'); render(); }
function viewRot(){
  if (NET.mode==='local' || MY==null || !S) return 0;
  const t = S.teams.find(t=>t.player===MY);
  return t ? {S:0,W:1,N:2,E:3}[t.pos] : 0;
}
function rot(r,c,k){ for(let i=0;i<k;i++){ const nr=12-c, nc=r; r=nr; c=nc; } return [r,c]; }
function arrowSVG(dirs, k, color){
  let g='';
  for (const [dr,dc] of dirs) { const a=Math.round(Math.atan2(dc,-dr)*180/Math.PI) - 90*k;
    g+=`<g transform="rotate(${a} 50 50)"><path d="M50 54V14M50 14L36 30M50 14L64 30"/></g>`; }
  return `<svg class="arw" viewBox="0 0 100 100"><g fill="none" stroke="${color||'#8a3d00'}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">${g}</g></svg>`;
}
const ICO={horse:'🐴',ice:'🧊',croc:'🐊',cannibal:'👹',trap:'⛓️',rum:'🍺',fort:'🏰',revive:'🏯',chest:'💰',balloon:'🎈',plane:'✈️'};
const MAZE_ICO={2:'🌴',3:'🏜️',4:'🐸',5:'⛰️'};
const GROUP={empty:'',arrow:'move',horse:'move',ice:'move',cannon:'move',croc:'bad',cannibal:'bad',trap:'bad',rum:'slow',maze:'slow',fort:'safe',revive:'safe',balloon:'safe',plane:'safe',chest:'gold'};
function glyph(t,k){
  if (t.type==='empty') return '';
  if (t.type==='arrow') return arrowSVG(t.dirs,k);
  if (t.type==='cannon') return `<span style="position:absolute;font-size:calc(var(--cell)*.32)">💥</span>`+arrowSVG([t.dir],k,'#b91c1c');
  if (t.type==='maze') return `<span>${MAZE_ICO[t.n]}</span><span class="n">${t.n}</span>`;
  if (t.type==='plane') return `<span class="${t.used?'faded':''}">✈️</span>`;
  if (t.type==='chest') return `<span class="${t.coins?'':'faded'}">💰</span>`;
  return `<span>${ICO[t.type]}</span>`;
}
function tipFor(t){ return E.tileName(t)+' — '+E.TILE[t.type].d; }

function render(){
  if (!S) return;
  const k = viewRot(), mine = canAct();
  const sel = UI.sel!=null ? S.pirates[UI.sel] : null;
  const marks = new Map();
  if (mine) {
    if (S.pending) S.pending.opts.forEach(o=>marks.set(o.r+','+o.c,'opt'));
    else if (sel) E.dests(S, sel).forEach(d=>marks.set(d.r+','+d.c,'dest'));
    else if (UI.ship) E.shipMoves(S, S.turn).forEach(d=>marks.set(d.r+','+d.c,'smv'));
  }
  const lastSet = new Set(); if (S.last && S.last.path) S.last.path.forEach(([r,c])=>lastSet.add(r+','+c));
  if (S.last && S.last.ship!=null) { const sh=S.teams[S.last.ship].ship; lastSet.add(sh.r+','+sh.c); }
  let h='';
  for (let vr=0; vr<13; vr++) for (let vc=0; vc<13; vc++) {
    const [r,c] = rot(vr,vc,(4-k)%4);
    const t = E.isLand(r,c) ? S.cells[r][c] : null;
    const si = E.shipAt(S,r,c);
    let cls='c', inner='', title='Вода', style='';
    if (!t) {
      cls+=' w';
      if (si>=0) { const ti=teamColor(si); cls+=' ship'; style=`box-shadow:inset 0 0 0 3px ${ti.color}`; inner='<span>⛵</span>'; title='Корабль: '+ti.name+' ('+S.names[S.teams[si].player]+')'; }
    } else if (!t.rev) { cls+=' hid'; title='Закрытая клетка'; }
    else {
      cls+=' rev '+(t.type==='empty'?'v'+(t.v||0):'g-'+GROUP[t.type]);
      inner=glyph(t,k); title=tipFor(t);
      if (t.coins) { inner+=`<span class="cn">${t.coins}</span>`; title+=' · лежит монет: '+t.coins; }
    }
    const key=r+','+c;
    if (marks.has(key)) cls+=' '+marks.get(key);
    if (lastSet.has(key)) cls+=' lastp';
    let tk='';
    for (const p of S.pirates) {
      if (p.loc==='dead' || p.r!==r || p.c!==c) continue;
      const info=teamColor(p.team);
      const mk = p.trapped ? '⛓' : E.drunkBlocked(S,p) ? 'z' : (p.loc==='land' && S.cells[r][c].type==='maze') ? p.step : p.loc==='water' ? '≈' : '';
      const own = mine && p.team===S.turn && !S.pending;
      const isSel = p.id===UI.sel;
      const lc = E.hasCoin(p);
      tk += `<span class="pir${own?' own':''}${isSel?' sel':''}${lc?' lc':''}${info.ink!=='#fff'?' light':''}" data-id="${p.id}" style="background:${info.color};color:${info.ink}" title="${info.name}${p.trapped?', в капкане':''}${lc?', несёт монету':''}">${mk}</span>`;
    }
    h += `<div class="${cls}" data-r="${r}" data-c="${c}" title="${esc(title)}"${style?` style="${style}"`:''}>${inner}${tk?`<div class="toks">${tk}</div>`:''}</div>`;
  }
  $('board').innerHTML = h;
  renderPanel(mine, sel);
}

function renderPanel(mine, sel){
  $('net').innerHTML = netBadge();
  const M = E.MODES[S.mode], on = seatsOnline();
  let ph='';
  const groups = M.alliance ? [[0,2],[1,3]] : S.names.map((_,i)=>[i]);
  for (const g of groups) {
    for (const pi of g) {
      const tis = S.teams.map((t,i)=>i).filter(i=>S.teams[i].player===pi);
      const sum = tis.reduce((a,i)=>a+S.teams[i].score,0);
      const cur = tis.includes(S.turn) && !S.over;
      ph += `<div class="pl${cur?' on':''}"><div class="nm"><span>${NET.mode!=='local'?`<span class="dot ${on[pi]?'ok':''}"></span>`:''}${esc(S.names[pi])}${pi===MY?' (вы)':''}</span><span>🪙 ${sum}</span></div>`;
      for (const ti of tis) {
        const info=teamColor(ti), alive=S.pirates.filter(p=>p.team===ti && p.loc!=='dead').length;
        ph += `<div class="tm${ti===S.turn&&!S.over?' cur':''}"><span class="sw" style="background:${info.color}"></span>${info.name}: ${S.teams[ti].score} 🪙 · пиратов ${alive}/3${ti===S.turn&&!S.over?' ← ходят':''}</div>`;
      }
      ph += '</div>';
    }
    if (M.alliance) { const s=g.reduce((a,pi)=>a+S.teams.filter(t=>t.player===pi).reduce((x,t)=>x+t.score,0),0);
      ph += `<div style="font-size:12px;color:var(--muted);margin:-2px 0 8px 4px">Союз: ${s} 🪙</div>`; }
  }
  $('players').innerHTML = ph;

  const ti=S.turn, info=teamColor(ti), who=S.names[S.teams[ti].player];
  let m;
  if (S.over) m='Игра окончена.';
  else if (!mine) m=`Ходят <b style="color:${info.color==='#26262b'?'#aaa':info.color}">${info.name}</b> (${esc(who)}). Ждём…`;
  else if (S.pending) m = S.pending.plane ? '✈ Самолёт! Нажмите любую клетку или корабль, либо сам самолёт — остаться.' : 'Пират ещё в движении — выберите оранжевую клетку.';
  else if (sel) {
    if (sel.trapped) m='Этот пират в капкане — его выручит только свой пират, пришедший на эту клетку.';
    else if (E.drunkBlocked(S,sel)) m='Пират пьян 🍺 и пропускает этот ход. Ходите другим.';
    else {
      const ds=E.dests(S,sel);
      m = ds.length ? 'Нажмите зелёную клетку, куда идти.' : 'Этому пирату сейчас некуда идти.';
      if (E.hasCoin(sel)) m += '<br>🪙 Несёт монету: только по открытым клеткам, атаковать нельзя, в крепость нельзя.';
    }
  } else if (UI.ship) m='Нажмите синюю клетку — куда сдвинуть корабль.';
  else m=`Ваш ход: <b style="color:${info.color==='#26262b'?'#ccc':info.color}">${info.name}</b>. Выберите пирата или нажмите на свой корабль, чтобы его сдвинуть.`;
  m += `<br><span style="opacity:.7;font-size:12px">Монет на острове: ${E.coinsLeft(S)} · несут пираты: ${S.pirates.filter(p=>p.coin).length} · утонуло: ${S.lost}</span>`;
  $('msg').innerHTML = m;
  $('msg').classList.toggle('me', mine && NET.mode!=='local');

  $('bRevive').hidden = !(mine && sel && E.canRevive(S,sel));
  const ctl = NET.mode!=='client';
  $('bEnd').hidden = !ctl || S.over;
  $('bEnd').textContent = UI.confirmEnd ? 'Точно закончить?' : 'Закончить игру';
  $('bAgain').hidden = !(ctl && S.over);
  $('log').innerHTML = S.log.slice(0,14).map(x=>`<div>${esc(x)}</div>`).join('');
  if (S.over) {
    const R=E.results(S);
    $('over').innerHTML = `<div class="over">🏆 ${R.winners.length>1?'Ничья':'Победа: '+esc(R.winners[0].name)}!<br><small>${R.groups.map(g=>esc(g.name)+': '+g.score).join(' · ')}</small></div>`;
  } else $('over').innerHTML='';

  // уведомление о ходе
  const key = S.turnNo+':'+S.over;
  if (NET.mode!=='local' && mine && UI.lastTurnKey!==key) { try{ navigator.vibrate && navigator.vibrate(120); }catch(e){} }
  UI.lastTurnKey = key;
  document.title = (NET.mode!=='local' && mine) ? '⚓ Ваш ход — Шакал' : 'Шакал — пиратская игра онлайн';
}

// ---------- игра: клики ----------
$('board').addEventListener('click', e=>{
  if (!S || !canAct()) { if (S && !S.over) toast('Сейчас не ваш ход'); return; }
  const ce = e.target.closest('.c'); if (!ce) return;
  const r=+ce.dataset.r, c=+ce.dataset.c;
  if (S.pending) { if (S.pending.opts.some(o=>o.r===r&&o.c===c)) doAct({k:'choose',r,c}); return; }
  const tok = e.target.closest('.pir');
  const sel = UI.sel!=null ? S.pirates[UI.sel] : null;
  if (sel) {
    const d = E.dests(S,sel).find(d=>d.r===r&&d.c===c);
    if (d) return doAct({ k:'move', pid:sel.id, r, c });
  }
  if (tok) {
    const p = S.pirates[+tok.dataset.id];
    if (p.team===S.turn) { UI.sel = p.id===UI.sel ? null : p.id; UI.ship=false; render(); return; }
  }
  if (UI.ship && E.shipMoves(S,S.turn).some(d=>d.r===r&&d.c===c)) return doAct({k:'ship',r,c});
  const sh = S.teams[S.turn].ship;
  if (r===sh.r && c===sh.c) {
    if (E.shipMoves(S,S.turn).length) { UI.ship=!UI.ship; UI.sel=null; render(); return; }
    toast('Корабль плывёт, только если на нём есть ваш пират');
  }
  UI.sel=null; UI.ship=false; render();
});
$('bRevive').onclick = ()=>{ if (UI.sel!=null) doAct({ k:'revive', pid:UI.sel }); };
$('bMenu').onclick = ()=>{ show('lobby'); renderResume(); };
$('bEnd').onclick = ()=>{
  if (!UI.confirmEnd) { UI.confirmEnd=true; render(); setTimeout(()=>{ UI.confirmEnd=false; if(!$('game').hidden) render(); }, 4000); return; }
  E.forceEnd(S); afterChange();
};
$('bAgain').onclick = ()=>{
  if (NET.mode==='host') { ROOM.started=false; S=null; saveHost(); broadcast(); show('room'); renderRoom(); }
  else { LS.del('shk-local'); S=null; show('lobby'); renderResume(); }
};

// ---------- правила ----------

$('rulesL').innerHTML = RULES; $('rulesG').innerHTML = RULES;

// ---------- легенда (крупная, для слабовидящих и новичков) ----------
const LEGEND = [
  ['💰','Сундук','Монеты, 1–5 штук. Пират, вставший на сундук, автоматически подбирает одну монету — если ещё ничего не несёт.'],
  ['➚','Стрелка','Пират сразу идёт в указанную сторону. Если стрелок несколько — выберите, в какую.'],

  ['🧊','Лёд','Пират сразу скользит дальше в ту же сторону, в которую шёл.'],
  ['🐊','Крокодил','Пират возвращается на клетку, с которой пришёл на эту.'],
  ['👹','Людоед','Пират погибает. Вернуть его может только аборигенка.'],
  ['⛓️','Капкан','Пират застревает здесь, пока на эту же клетку не придёт его товарищ по команде.'],
  ['🍺','Бочонок рома','Пират напился и пропускает свой следующий ход.'],
  ['🌴','Джунгли (2 хода)','Чтобы пройти клетку насквозь, нужно простоять на ней 2 хода подряд.'],

  ['⛰️','Горы (5 ходов)','Чтобы пройти клетку насквозь, нужно простоять на ней 5 ходов подряд.'],

  ['✈️','Самолёт','Один раз за игру переносит пирата, со всей поклажей, в любую точку острова или на корабль.'],
  ['💥','Пушка','Выстреливает пиратом в сторону моря. Попал на свой корабль — доставил монету, в воду или на чужой корабль — погиб.'],
];
function buildLegend(){
  $('legendBody').innerHTML =
    `<div class="legItem"><span class="legIco">🟫</span><div class="legTxt"><b>Закрытая клетка</b><span>Переверните её, наступив на неё — узнаете, что там.</span></div></div>` +
    LEGEND.map(([ico,name,d])=>`<div class="legItem"><span class="legIco">${ico}</span><div class="legTxt"><b>${name}</b><span>${d}</span></div></div>`).join('') +
    `<div class="legItem"><span class="legIco">⛵</span><div class="legTxt"><b>Корабль</b><span>Везёт ваших пиратов. Сходят они только на клетку прямо перед ним.</span></div></div>` +
    `<div class="legItem"><span class="legIco" style="font-size:26px">⬤<span style="position:relative;left:-26px;top:7px;font-size:14px">🪙</span></span><div class="legTxt"><b>Золотое кольцо и 🪙 на пирате</b><span>Этот пират несёт монету — она не входит в цифру на клетке. Цифра в жёлтом кружке показывает, сколько монет лежит на клетке. С монетой он ходит только по открытым клеткам и не может атаковать.</span></div></div>`;
}
function openLegend(){ buildLegend(); $('legendModal').hidden=false; }
function closeLegend(){ $('legendModal').hidden=true; }
$('bLegendTop').onclick = openLegend;
$('bLegendLobby').onclick = openLegend;
$('bLegendClose').onclick = closeLegend;
$('legendModal').addEventListener('click', e=>{ if (e.target.id==='legendModal') closeLegend(); });

// ---------- старт ----------
renderResume();
(function(){
  const code = (location.hash||'').replace('#','').trim().toUpperCase();
  if (/^[A-Z0-9]{4,6}$/.test(code)) {
    $('joincode').value = code;
    history.replaceState(null,'',location.pathname+location.search);
    const host = LS.get('shk-host');
    if (host && host.code===code) return; // это моя комната — продолжить через кнопку
    if (LS.get('shk-name')) joinRoom(code);
    else { toast('Введите имя и нажмите «Войти»'); $('myname').focus(); }
  }
})();
window.__app = { get S(){return S}, get NET(){return NET}, get MY(){return MY}, doAct, E };
